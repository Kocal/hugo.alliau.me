# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        uploads.storage:
            adapter: 'asyncaws'
            options:
                client: 'app.s3_client'
                bucket: '%env(S3_BUCKET)%'

when@test:
    flysystem:
        storages:
            uploads.storage:
                adapter: 'memory'
