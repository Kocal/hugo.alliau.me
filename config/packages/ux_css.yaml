        fonts:
            sans:
                - '"Inter var"'
                - '"Inter Variable Fallback"'
                - 'ui-sans-serif'
                - 'system-ui'
                - 'sans-serif'
                - '"Apple Color Emoji"'
                - '"Segoe UI Emoji"'
                - '"Segoe UI"'
                - '"Symbol"'
                - '"Noto Color Emoji"'
        # Tailwind CSS sets a line height with each font size, Panda CSS does not
        lineHeights:
            xs: 'calc(1 / 0.75)'
            sm: 'calc(1.25 / 0.875)'
            md: '1.5'
            lg: 'calc(1.75 / 1.125)'
            xl: 'calc(1.75 / 1.25)'
            2xl: 'calc(2 / 1.5)'
            3xl: 'calc(2.25 / 1.875)'
            4xl: 'calc(2.5 / 2.25)'
            5xl: '1'
            6xl: '1'
            7xl: '1'
            8xl: '1'
            9xl: '1'

    semantic_tokens:
        colors:
            fg:
                DEFAULT: { base: '{colors.zinc.700}', _dark: '{colors.zinc.300}' }
                secondary: { base: '{colors.zinc.600}', _dark: '{colors.zinc.300}' }
                muted: { base: '{colors.zinc.500}', _dark: '{colors.zinc.400}' }
                hover: { base: '{colors.primary.700}', _dark: '{colors.slate.400}' }
            bg:
                canvas: { base: '{colors.slate.50}', _dark: '{colors.canvasDark}' }
                surface: { base: '{colors.white}', _dark: '{colors.zinc.900}' }
                footer: { base: '{colors.slate.100}', _dark: '{colors.zinc.900}' }
                hover: { base: '{colors.slate.100}', _dark: '{colors.white/5}' }
            border:
                DEFAULT: { base: '{colors.slate.200}', _dark: '{colors.white/10}' }
                subtle: { base: '{colors.slate.200}', _dark: '{colors.white/6}' }
                strong: { base: '{colors.slate.300}', _dark: '{colors.white/20}' }
                prose: { base: '{colors.gray.300}', _dark: '{colors.transparent}' }
            accent:
                DEFAULT: { base: '{colors.primary.500}', _dark: '{colors.primary.400}' }
                fg: { base: '{colors.primary.700}', _dark: '{colors.primary.300}' }
                emphasis: { base: '{colors.primary.600}', _dark: '{colors.primary.400}' }
            link:
                DEFAULT: { base: '{colors.primary.700}', _dark: '{colors.primary.400}' }
                hover: { base: '{colors.primary.800}', _dark: '{colors.primary.300}' }
            callout:
                info: { base: '{colors.blue.600}', _dark: '{colors.blue.300}' }
                tip: { base: '{colors.green.600}', _dark: '{colors.green.300}' }
                warning: { base: '{colors.yellow.600}', _dark: '{colors.yellow.300}' }
                danger: { base: '{colors.red.600}', _dark: '{colors.red.300}' }
