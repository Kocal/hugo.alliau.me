# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # https://symfony.com/doc/current/performance.html#dump-the-service-container-into-a-single-file
    .container.dumper.inline_factories: true

    app.menu_definition:
        - label: 'nav.blog'
          route: !php/enum App\Blog\Domain\Data\Route::HOME->value
          extras:
              routes:
                  - route: !php/enum App\Blog\Domain\Data\Route::POST_VIEW->value
                  - route: !php/enum App\Blog\Domain\Data\Route::TAG_LIST->value
                  - route: !php/enum App\Blog\Domain\Data\Route::TAG_VIEW->value
        - label: 'nav.cv'
          route: !php/enum App\CV\Domain\Data\Route::INDEX->value
        - label: 'nav.places'
          route: !php/enum App\Places\Domain\Data\Route::INDEX->value
        - label: 'nav.recipes'
          route: !php/enum App\Recipes\Domain\Data\Route::LIST->value
          extras:
              routes:
                  - route: !php/enum App\Recipes\Domain\Data\Route::VIEW->value

    # Routes that only exist under one locale (e.g. a blog post or a recipe only has a French
    # or an English version). The language switcher and hreflang alternates read this list
    # instead of hardcoding route names, so a new single-locale route only needs an entry here.
    app.single_locale_routes:
        - route: !php/enum App\Blog\Domain\Data\Route::POST_VIEW->value
          fallback_route: !php/enum App\Blog\Domain\Data\Route::HOME->value
        - route: !php/enum App\Recipes\Domain\Data\Route::VIEW->value
          fallback_route: !php/enum App\Recipes\Domain\Data\Route::LIST->value

imports:
    - { resource: 'services/*.php' }
