name: CI

defaults:
    run:
        shell: bash

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches:
            - main
    workflow_dispatch: ~

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    qa:
        if: ${{ ! github.event.pull_request.draft }}
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  extensions: ctype, iconv, mbstring
                  tools: symfony

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Start Docker containers
              run: docker compose up -d --wait

            - name: Install project
              run: make app.install

            - name: Install pnpm dependencies
              run: pnpm install --frozen-lockfile

            - name: Build assets
              run: pnpm run build

            - name: QA
              run: make qa

    docker_build:
        if: ${{ ! github.event.pull_request.draft }}
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build Docker images
              uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
              with:
                  pull: true
                  load: true
                  source: .
                  files: |
                      compose.yaml
                      compose.override.yaml
                      compose.prod.yaml
                  set: |
                      *.cache-from=type=gha,scope=${{github.ref}}
                      *.cache-from=type=gha,scope=refs/heads/main
                      *.cache-to=type=gha,scope=${{github.ref}},mode=max

            - name: Start services
              run: docker compose -f compose.yaml -f compose.prod.yaml -f compose.ci.yaml up --wait --no-build

            - name: Check HTTP reachability
              run: curl -v --insecure --fail-with-body https://localhost

            - name: Show services logs
              if: failure()
              run: docker compose -f compose.yaml -f compose.prod.yaml -f compose.ci.yaml logs

    docker_lint:
        name: Docker Lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
            statuses: write
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Lint Dockerfile
              uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
